<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Orbit - Personal Life Tools Suite & Intelligent Expense Tracker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- PWA Color & Status Bar Adaptation -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="application-name" content="Orbit" />
    <meta name="msapplication-TileColor" content="#09090b" />
    
    <title>Orbit — Personal Tools Suite</title>

    <!-- Typography: Plus Jakarta Sans (Headings) + Inter (Body) + JetBrains Mono (Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('orbit_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 antialiased dark:bg-[#09090b] dark:text-[#f4f4f5] min-h-screen transition-colors duration-150 select-none sm:select-auto">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
